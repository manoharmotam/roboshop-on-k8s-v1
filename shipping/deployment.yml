apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  namespace: roboshop
  labels:
    project: roboshop
    tier: backend
    component: shipping
spec:
  replicas: 2
  selector:
    matchLabels:
      project: roboshop
      tier: backend
      component: shipping
  template:
    metadata:
      labels:
        project: roboshop
        tier: backend
        component: shipping
    spec:
      containers:
      - name: shipping
        image: mrmotam/shipping:v1
        startupProbe:
          httpGet:
            path: /health
            port: liveness-port
          periodSeconds: 10
          failureThreshold: 12
        readinessProbe:
          httpGet:
            path: /health
            port: liveness-port
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: liveness-port
          periodSeconds: 10
        env:
        - name: CART_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: shipping-cm
              key: CART_ENDPOINT
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: shipping-cm
              key: DB_HOST
        # resources:
        #   requests:
        #     cpu: "250m"
        #     memory: "256Mi"
        #   limits:
        #     memory: "128Mi"
        #     cpu: "500m"
        ports:
        - name: liveness-port
          containerPort: 8080
