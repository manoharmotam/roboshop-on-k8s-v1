apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: roboshop
  labels:
    project: roboshop
    tier: backend
    component: catalogue
spec:
  replicas: 2
  selector:
    matchLabels:
      project: roboshop
      tier: backend
      component: catalogue
  template:
    metadata:
      labels:
        project: roboshop
        tier: backend
        component: catalogue
    spec:
      containers:
      - name: catalogue
        image: mrmotam/catalogue:v1
        env:
        - name: MONGO
          valueFrom:
            configMapKeyRef:
              name: catalogue-cm
              key: MONGO
        - name: MONGO_URL
          valueFrom:
            configMapKeyRef:
              name: catalogue-cm
              key: "MONGO_URL"
        # resources:
        #   requests:
        #     cpu: "250m"
        #     memory: "256Mi"
        #   limits:
        #     memory: "128Mi"
        #     cpu: "500m"
        ports:
        - containerPort: 8080
