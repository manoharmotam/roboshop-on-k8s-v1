apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: roboshop
  labels:
    project: roboshop
    tier: backend
    component: cart
spec:
  replicas: 2
  selector:
    matchLabels:
      project: roboshop
      tier: backend
      component: cart
  template:
    metadata:
      labels:
        project: roboshop
        tier: backend
        component: cart
    spec:
      containers:
      - name: cart
        image: mrmotam/cart:v1
        env:
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: cart-cm
              key: REDIS_HOST
        - name: CATALOGUE_HOST
          valueFrom:
            configMapKeyRef:
              name: cart-cm
              key: CATALOGUE_HOST
        - name: CATALOGUE_PORT
          valueFrom:
            configMapKeyRef:
              name: cart-cm
              key: CATALOGUE_PORT
        # resources:
        #   requests:
        #     cpu: "250m"
        #     memory: "256Mi"
        #   limits:
        #     memory: "128Mi"
        #     cpu: "500m"
        ports:
        - containerPort: 8080
